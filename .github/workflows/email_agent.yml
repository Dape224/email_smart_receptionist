name: Run Email Router Agent

on:
  schedule:
    # Runs every 10 minutes (Cron syntax: */10 means every 10 mins)
    - cron: '*/10 * * * *'
  workflow_dispatch: # This button allows you to trigger it manually for testing!

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run the Email Agent
        env:
          # Injecting the secrets we created in Step 3 into the environment
          EMAIL: ${{ secrets.EMAIL }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          ESCALATION_WEBHOOK: ${{ secrets.ESCALATION_WEBHOOK }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # ADD YOUR OTHER KEYS HERE IF NEEDED (e.g., LANGFUSE_PUBLIC_KEY)
        run: python mail_reader.py